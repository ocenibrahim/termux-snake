<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>Snake</title><style>body{background:#0f1220;color:#fff;font-family:monospace;display:flex;flex-direction:column;align-items:center;touch-action:none}h1{color:#5af2c8}
  canvas{border:2px solid #5af2c8;background:#0a0a15}.c{display:grid;grid-template-columns:60px 60px 60px;grid-template-rows:60px 60px 60px;gap:6px;margin-top:12px}.b{background:#1a1d30;border:2px solid #2a2d45;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}
  #u{grid-column:2;grid-row:1}#l{grid-column:1;grid-row:2}#r{grid-column:3;grid-row:2}#d{grid-column:2;grid-row:3}</style></head><body><h1>SNAKE</h1><canvas id="g" width="300" height="300"></canvas><div class="c"><div class="b" id="u">▲</div><div class="b" id="l">◀</div><div class="b" id="r">▶</div><div class="b" id="d">▼</div></div><script>let C=g.getContext('2d'),S=15,N=20,sn=[{x:10,y:10}],d='R',nd='R',f={x:5,y:5};
    function D(){C.fillStyle='#0a0a15';C.fillRect(0,0,300,300);C.fillStyle='red';C.fillRect(f.x*S,f.y*S,S-2,S-2);sn.forEach((p,i)=>{C.fillStyle=i==0?'#5af2c8':'#1ec48a';C.fillRect(p.x*S,p.y*S,S-2,S-2)})}function T(){nd&&(d=nd);let h={...sn[0]};if(d=='U')h.y--;if(d=='D')h.y++;if(d=='L')h.x--;if(d=='R')h.x++;if(h.x<0||h.x>=N||h.y<0||h.y>=N||sn.some(v=>v.x==h.x&&v.y==h.y)){sn=[{x:10,y:10}];return}sn.unshift(h);if(h.x==f.x&&h.y==f.y){f={x:Math.random()*N|0,y:Math.random()*N|0}}else sn.pop();D()}setInterval(T,120);function SD(x){if(x=='U'&&d!='D')nd='U';if(x=='D'&&d!='U')nd='D';if(x=='L'&&d!='R')nd='L';if(x=='R'&&d!='L')nd='R'}u.ontouchstart=e=>{e.preventDefault();SD('U')};d.ontouchstart=e=>{e.preventDefault();SD('D')};l.ontouchstart=e=>{e.preventDefault();SD('L')};r.ontouchstart=e=>{e.preventDefault();SD('R')};D();</script></body></html>
