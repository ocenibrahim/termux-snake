<!DOCTYPE html><body><canvas id=c width=300 height=300 style="background:#111;border:2px solid green"></canvas><script>let a=c.getContext("2d"),b=15,d=20,e=[{x:10,y:10}],f=1,g=0,h={x:5,y:5};setInterval(()=>{let j={x:e[0].x+f,y:e[0].y+g};if(j.x<0||j.y<0||j.x>=d||j.y>=d||e.some(k=>k.x==j.x&&k.y==j.y))e=[{x:10,y:10}];else{e.unshift(j);if(j.x==h.x&&j.y==h.y)h={x:Math.random()*d|0,y:Math.random()*d|0};else e.pop()}a.fillStyle="#111";a.fillRect(0,0,300,300);a.fillStyle="red";a.fillRect(h.x*b,h.y*b,12,12);a.fillStyle="lime";e.map(k=>a.fillRect(k.x*b,k.y*b,12,12))},120);addEventListener("keydown",k=>{if(k.key=="ArrowUp")f=0,g=-1;if(k.key=="ArrowDown")f=0,g=1;if(k.key=="ArrowLeft")f=-1,g=0;if(k.key=="ArrowRight")f=1,g=0})</script><br><button onclick="f=0;g=-1">UP</button><button onclick="f=0;g=1">DOWN</button><button onclick="f=-1;g=0">LEFT</button><button onclick="f=1;g=0">RIGHT</button>
