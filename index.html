<!DOCTYPE html><meta name=viewport content="width=device-width,initial-scale=1"><style>
body{margin:0;background:#070a0f;color:#fff;text-align:center;font-family:sans-serif}
canvas{border:3px solid #1a5c45;background:#111;border-radius:12px}
button{border:0;border-radius:12px;padding:12px 16px;margin:4px;background:#1e2a3a;color:#5af2c8;font-weight:bold}
#b{width:192px;display:grid;grid-template-columns:60px 60px 60px;gap:6px;margin:12px auto}
</style><h2 style=color:#5af2c8>Score:<span id=s>0</span></h2>
<button onclick="start()" style="background:#5af2c8;color:#000">▶ START GAME</button>
<canvas id=c width=300 height=300></canvas>
<div id=b>
<button style=grid-column:2 onclick="dx=0;dy=-1">▲</button>
<button onclick="dx=-1;dy=0">◀</button>
<button onclick="dx=0;dy=1">▼</button>
<button onclick="dx=1;dy=0">▶</button>
</div>
<button onclick="alert('To DOWNLOAD: Chrome 3 dots > Add to Home Screen')">📲 DOWNLOAD APP</button>
<script>
let cv=c.getContext("2d"),S=15,N=20,sn,dx,dy,f,sc,t;
function init(){sn=[{x:10,y:10}];dx=1;dy=0;f={x:5,y:5};sc=0}
function draw(){cv.fillStyle="#111";cv.fillRect(0,0,300,300);cv.fillStyle="red";cv.fillRect(f.x*S,f.y*S,S-2,S-2);cv.fillStyle="#5af2c8";sn.forEach(p=>cv.fillRect(p.x*S,p.y*S,S-2,S-2));s.innerText=sc}
function loop(){let h={x:sn[0].x+dx,y:sn[0].y+dy};if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(v=>v.x==h.x&&v.y==h.y)){clearInterval(t);alert("GAME OVER Score:"+sc);return}sn.unshift(h);if(h.x==f.x&&h.y==f.y){sc++;f={x:Math.random()*N|0,y:Math.random()*N|0}}else sn.pop();draw()}
function start(){init();clearInterval(t);t=setInterval(loop,120);draw()}
init();draw();
</script>
